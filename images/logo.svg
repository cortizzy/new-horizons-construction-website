svg content for logo - save as logo.svg in images folder

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)"/>
  
  <!-- Building outline -->
  <g transform="translate(100, 100)">
    <!-- Main building base -->
    <rect x="-35" y="-20" width="70" height="80" fill="none" stroke="white" stroke-width="3" rx="5"/>
    
    <!-- Windows grid -->
    <rect x="-28" y="-12" width="8" height="8" fill="white"/>
    <rect x="-10" y="-12" width="8" height="8" fill="white"/>
    <rect x="8" y="-12" width="8" height="8" fill="white"/>
    
    <rect x="-28" y="0" width="8" height="8" fill="white"/>
    <rect x="-10" y="0" width="8" height="8" fill="white"/>
    <rect x="8" y="0" width="8" height="8" fill="white"/>
    
    <rect x="-28" y="12" width="8" height="8" fill="white"/>
    <rect x="-10" y="12" width="8" height="8" fill="white"/>
    <rect x="8" y="12" width="8" height="8" fill="white"/>
    
    <rect x="-28" y="24" width="8" height="8" fill="white"/>
    <rect x="-10" y="24" width="8" height="8" fill="white"/>
    <rect x="8" y="24" width="8" height="8" fill="white"/>
    
    <!-- Roof -->
    <polygon points="-35,-20 -45,-35 45,-35 35,-20" fill="white" opacity="0.8"/>
    
    <!-- Door -->
    <rect x="-12" y="50" width="24" height="30" fill="none" stroke="white" stroke-width="2" rx="2"/>
    
    <!-- Door handle -->
    <circle cx="8" cy="65" r="2" fill="white"/>
  </g>
</svg>